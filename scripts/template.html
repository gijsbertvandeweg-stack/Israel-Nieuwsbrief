<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Israël Nieuwsbrief – {{DATUM_LANG}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+1p:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  body { font-family: 'M PLUS 1p', 'Leelawadee UI', Leelawadee, Arial, sans-serif; max-width: 760px; margin: 0 auto; padding: 24px 20px; color: #1a1a2e; background: #fdfcf8; line-height: 1.6; }
  header { border-bottom: 3px solid #0038b8; padding-bottom: 14px; margin-bottom: 24px; }
  h1 { margin: 0; font-size: 1.9em; color: #0038b8; }
  .datum { color: #666; font-size: 0.95em; margin-top: 4px; }
  .intro { background: #eef3ff; border-left: 4px solid #0038b8; padding: 14px 18px; border-radius: 0 8px 8px 0; margin-bottom: 28px; }
  .intro h2 { margin: 0 0 8px; font-size: 1.1em; color: #0038b8; }
  section { margin-bottom: 32px; }
  h2.blok { font-size: 1.35em; border-bottom: 2px solid #d9d4c5; padding-bottom: 6px; color: #22223b; }
  article { margin-bottom: 18px; }
  h3 { margin: 0 0 4px; font-size: 1.08em; }
  p { margin: 0; }
  .bron { font-size: 0.85em; color: #777; }
  .bron a { color: #0038b8; text-decoration: none; }
  .verssig { font-size: 0.8em; color: #999; margin-top: 6px; }
  #stale { display: none; background: #fff4e5; border-left: 4px solid #d9822b; color: #7a4a12; padding: 12px 16px; border-radius: 0 8px 8px 0; margin-bottom: 20px; font-size: 0.92em; }
  #stale strong { color: #b35c00; }
  #stale button { margin-top: 8px; font: inherit; background: #0038b8; color: #fff; border: 0; border-radius: 6px; padding: 7px 14px; cursor: pointer; }
  #staleMelding { display: none; margin-top: 8px; font-weight: 500; color: #7a4a12; }
  #stale button:disabled { opacity: .6; cursor: default; }
  footer { border-top: 1px solid #d9d4c5; margin-top: 30px; padding-top: 12px; font-size: 0.85em; color: #888; }
</style>
</head>
<body data-editie-datum="{{DATUM_ISO}}">
<header>
  <h1>🇮🇱 Israël Nieuwsbrief</h1>
  <div class="datum">{{DATUM_KAP}} · Editie {{EDITIE}}</div>
  <div class="verssig">Bijgewerkt: {{GEGENEREERD}}</div>
</header>

<div id="stale">
  <strong>Let op: dit is niet de editie van vandaag.</strong><br>
  Je leest de editie van <span id="staleDatum"></span>. De nieuwe editie is nog niet gepubliceerd,
  of je telefoon toont een opgeslagen versie.
  <div id="staleMelding"></div>
  <button id="refreshBtn" type="button">Opnieuw ophalen</button>
</div>

{{CONTENT}}
<script>
(function () {
  var editie = document.body.getAttribute('data-editie-datum');
  if (!editie) return;

  var nu = new Date();
  var vandaag = nu.getFullYear() + '-' +
                String(nu.getMonth() + 1).padStart(2, '0') + '-' +
                String(nu.getDate()).padStart(2, '0');

  var balk = document.getElementById('stale');
  var knop = document.getElementById('refreshBtn');
  var melding = document.getElementById('staleMelding');

  var netGeprobeerd = false;
  try {
    netGeprobeerd = sessionStorage.getItem('nbRefresh') === '1';
    sessionStorage.removeItem('nbRefresh');
  } catch (e) {}

  if (editie < vandaag) {
    var d = editie.split('-');
    var leesbaar = d[2] + '-' + d[1] + '-' + d[0];
    document.getElementById('staleDatum').textContent = leesbaar;
    balk.style.display = 'block';
    if (netGeprobeerd && melding) {
      melding.textContent = 'Opnieuw opgehaald: er is nog geen nieuwere editie gepubliceerd. ' +
                            'De laatste blijft die van ' + leesbaar + '.';
      melding.style.display = 'block';
    }
  } else if (netGeprobeerd && balk) {
    balk.style.display = 'none';
  }

  if (knop) {
    knop.addEventListener('click', function () {
      knop.disabled = true;
      knop.textContent = 'Bezig met ophalen\u2026';
      if (melding) { melding.textContent = ''; melding.style.display = 'none'; }
      try { sessionStorage.setItem('nbRefresh', '1'); } catch (e) {}
      var url = location.pathname + '?v=' + Date.now();
      setTimeout(function () { location.replace(url); }, 150);
      setTimeout(function () { location.reload(); }, 2500);
    });
  }
})();
</script>
</body>
</html>
